site_name: enroute
site_description: Unified LLM routing with first-class traces, environments, and benchmarks.
site_url: https://enroute-ai.github.io/enroute/
repo_url: https://github.com/enroute-ai/enroute
repo_name: enroute-ai/enroute

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - llmstxt:
      markdown_description: Unified LLM routing with traces, environments, and benchmarks.
      sections:
        Concepts:
          - docs/concepts/*.md
        Guides:
          - docs/guides/*.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Trace: concepts/trace.md
      - Environment: concepts/environment.md
      - Dataset: concepts/dataset.md
      - Benchmark: concepts/benchmark.md
      - Routing policy: concepts/routing.md
      - Sink: concepts/sink.md
  - Guides:
      - Routing examples walkthrough: guides/routing-examples.md
      - Capture traces from an app: guides/capture-traces.md
      - Production traffic to a dataset: guides/production-to-dataset.md
      - Write your first environment: guides/write-environment.md
      - Benchmark models: guides/benchmark-models.md
      - Redact PII: guides/redact-pii.md
      - Export to OpenTelemetry: guides/export-otel.md
      - Add your own provider: guides/add-provider.md
      - Migrate from OpenRouter: guides/migrate-openrouter.md
  - Reference:
      - API: reference/api.md
      - Trace JSON schema: reference/trace-schema.md
      - Glossary: reference/glossary.md
