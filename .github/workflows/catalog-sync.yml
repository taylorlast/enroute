name: Catalog sync

# Prices are pass-through, so every rate change lands as a reviewable PR rather
# than going straight to main.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      add_unserved:
        description: Propose models even when no configured provider lists them
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev

      - name: Sync catalog
        env:
          # Optional. Without them the sync still runs off OpenRouter and simply
          # cannot confirm which models we can serve today.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          uv run python -m enroute.catalog.sync \
            --write \
            --report catalog-report.md \
            ${{ inputs.add_unserved && '--add-unserved' || '' }}

      - name: Verify the catalog still loads
        run: uv run pytest -q -m "not live" tests/unit/test_catalog.py tests/unit/test_catalog_sync.py

      - name: Read report
        id: report
        run: |
          {
            echo 'body<<REPORT_EOF'
            cat catalog-report.md
            echo
            echo '---'
            echo 'Opened by the scheduled catalog sync. Unpriced models stay hidden'
            echo 'from the gateway until a rate is filled in.'
            echo 'After merging, tag a release and bump `ENROUTE_REF` in lastlabs.'
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"
          rm catalog-report.md

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog/sync
          title: "Catalog: refresh model pricing and availability"
          body: ${{ steps.report.outputs.body }}
          commit-message: |
            Refresh the model catalog from upstream.

            Generated by the scheduled catalog sync.
          labels: catalog
          delete-branch: true
