name: Catalog sync

# Pricing is pass-through, so a stale rate bills the wrong amount on every
# request. This diffs the bundled catalog against OpenRouter's public listing and
# opens a pull request when a price has moved.
#
# It deliberately uses no secrets: this repository is public, and provider keys
# belong to the deployments that consume the library. Without keys the sync
# cannot confirm which models a given deployment can serve, which is fine —
# downstream gateways already decide availability at request time from the keys
# they hold.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      add:
        description: Space-separated model ids to bring into the catalog
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev

      - name: Sync catalog
        run: |
          add_args=""
          for model in ${{ inputs.add }}; do
            add_args="$add_args --add $model"
          done
          uv run python -m enroute.catalog.sync \
            --write --report catalog-report.md $add_args

      - name: Verify the catalog still loads
        run: uv run pytest -q -m "not live" tests/unit/test_catalog.py tests/unit/test_catalog_sync.py

      # Candidates are reported even when nothing changed, so new models are
      # still visible on weeks that open no pull request.
      - name: Publish report
        id: report
        run: |
          cat catalog-report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'body<<REPORT_EOF'
            cat catalog-report.md
            echo
            echo '---'
            echo 'Opened by the scheduled catalog sync. Prices are applied automatically;'
            echo 'adding a model is deliberate, so re-run this workflow with `add` set.'
            echo 'An unpriced model stays hidden downstream until a rate is filled in.'
            echo 'After merging, tag a release so deployments can bump their pinned ref.'
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"
          rm catalog-report.md

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog/sync
          title: "Catalog: refresh model pricing"
          body: ${{ steps.report.outputs.body }}
          commit-message: |
            Refresh model pricing from upstream.

            Generated by the scheduled catalog sync.
          labels: catalog
          delete-branch: true
